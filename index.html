<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex, nofollow">

<title>報告目錄</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;900&family=UnifrakturMaguntia&display=swap">
<style>
body { margin:0; padding:24px 12px; background:#d9cfb8; }
.paper {
  max-width: 920px; margin: 0 auto; padding: 28px 34px 36px;
  background-color: #f3ead3;
  background-image: radial-gradient(ellipse at center, rgba(255,250,235,.55) 0%, rgba(214,196,156,.35) 100%);
  color: #2a2118;
  font-family: "Noto Serif TC", "PMingLiU", "新細明體", "MingLiU", "Songti TC", Georgia, "Times New Roman", serif;
  border: 1px solid #b9a77f;
  box-shadow: 0 2px 14px rgba(60,40,10,.25);
}
.ear { display:flex; justify-content:space-between; font-size:12px; color:#5a4a36; letter-spacing:1px; }
.masthead {
  text-align:center; margin: 6px 0 4px; padding: 8px 0 6px;
  border-top: 4px double #2a2118; border-bottom: 1px solid #2a2118;
}
.masthead .name {
  font-family: "UnifrakturMaguntia", "Old English Text MT", "Noto Serif TC", "PMingLiU", serif;
  font-size: 54px; line-height: 1.05; letter-spacing: 6px; font-weight: 900; margin: 0;
}
.masthead .tag { font-size: 13px; letter-spacing: 4px; color:#4a3b2a; margin-top: 4px; }
.dateline {
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px;
  font-size: 13px; padding: 5px 2px; border-bottom: 4px double #2a2118; margin-bottom: 18px;
}
.section { margin-top: 22px; }
.section-head {
  text-align:center; font-size: 22px; font-weight: 900; letter-spacing: 8px;
  border-top: 2px solid #2a2118; border-bottom: 1px solid #2a2118; padding: 5px 0; margin-bottom: 6px;
}
.section-note { text-align:center; font-size: 13px; font-style: italic; color:#5a4a36; margin: 0 0 14px; }
.columns { column-count: 2; column-gap: 32px; column-rule: 1px solid #a8956c; }
.article { break-inside: avoid; -webkit-column-break-inside: avoid; page-break-inside: avoid;
  padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px dashed #a8956c; }
.headline { font-size: 21px; font-weight: 900; line-height: 1.3; margin: 0 0 4px; }
.headline a { color:#2a2118; text-decoration:none; border-bottom: 1px solid #2a2118; }
.byline { font-size: 12px; color:#5a4a36; letter-spacing: 1px; margin-bottom: 8px; }
.body { font-size: 15px; line-height: 1.85; text-align: justify; margin: 0 0 6px; }
.body.lead::first-letter { float:left; font-size: 46px; line-height: .9; font-weight: 900; padding: 4px 6px 0 0; }
.label { font-weight: 900; }
.photo { margin: 4px 0 10px; border: 1px solid #8f7d58; padding: 4px; background: #e9dfc4; }
.photo img { display:block; width:100%; height:auto; max-height: 260px; object-fit: contain; background:#fff; }
.photo .cap { font-size: 11px; color:#5a4a36; margin-top: 3px; letter-spacing: 1px; }
.raw { font-size: 12px; color:#6b5a44; font-style: italic; }
.empty { text-align:center; font-style: italic; color:#5a4a36; }
.foot { margin-top: 26px; padding-top: 8px; border-top: 4px double #2a2118;
  text-align:center; font-size: 12px; color:#5a4a36; letter-spacing: 1px; }
@media (max-width: 640px) {
  .paper { padding: 18px 16px 24px; }
  .masthead .name { font-size: 36px; letter-spacing: 3px; }
  .columns { column-count: 1; }
}
</style>
</head>
<body>
<div class="paper">
  <div class="ear"><span>自動編採．本機發行</span><span></span></div>
  <div class="masthead">
    <div class="name">雷達報合訂本</div>
    <div class="tag">技術雷達報．學術日報　歷期目錄</div>
  </div>
  <div class="dateline"><span>中華民國一一五年十一月十二日　星期四</span><span>報告目錄</span></div>

  <div class="foot">本站內容由程式自動產生。</div>
</div>
</body>
</html>
